server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /api

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:106.14.165.141}:${DB_PORT:3306}/${DB_NAME:beadforge}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${DB_USERNAME:root}
    # 开发默认值仅供本地；生产必须通过 DB_PASSWORD 覆盖。ConfigGuard 会在非默认 profile 下强制检查。
    password: ${DB_PASSWORD:root_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      max-lifetime: 300000
      idle-timeout: 180000
      connection-timeout: 30000
      keepalive-time: 60000
      connection-test-query: SELECT 1
      validation-timeout: 5000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产用 SLF4J（受 logging.level 控制）；开发可临时改 StdOutImpl 观察 SQL
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 开发默认值仅供本地；生产必须通过 JWT_SECRET 覆盖（≥32 字符强随机）。ConfigGuard 会在非 dev profile 下强制检查。
  secret: ${JWT_SECRET:dev-insecure-secret-do-not-use-in-production-min-32-chars}
  expiration: 86400000

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

cors:
  # 逗号分隔；仅写明确域名；可用通配符 pattern（如 https://*.example.com）
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:19006}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.beadforge.controller

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-40.40logger{39}){cyan} : %msg%n"
  level:
    com.beadforge: ${LOG_LEVEL:debug}
    # 默认开 SQL（开发期），生产用 SQL_LOG_LEVEL=info 关闭
    com.beadforge.repository: ${SQL_LOG_LEVEL:debug}
    # Spring 请求映射 + Tomcat 错误日志
    org.springframework.web: ${WEB_LOG_LEVEL:info}
